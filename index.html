<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMANTAP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text-main: #ffffff;
    --text-muted: #a0aec0;
    --glass-bg: rgba(20, 25, 35, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --accent-blue: #3182ce;
    --accent-orange: #dd6b20;
    --accent-green: #38a169;
    --rejected: #e53e3e;
  }
  
  * { 
    box-sizing: border-box; 
  }
  
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    background: linear-gradient(-45deg, #0b192c, #1a365d, #5c3a21, #0f3a24);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .global-logos {
    position: absolute;
    top: 24px;
    right: 32px;
    display: flex;
    gap: 16px;
    z-index: 100;
  }

  .global-logos img {
    height: 170px; 
    object-fit: contain;
    background: transparent; 
    padding: 0; 
    border-radius: 0; 
    filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.9)) 
            drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.5));
  }

  header {
    padding: 64px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-size: clamp(28px, 4vw, 44px);
    margin: 0;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  header p {
    color: var(--text-muted);
    margin-top: 10px;
    font-weight: 300;
  }
  
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
  }

  .main-menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .main-menu { 
      grid-template-columns: 1fr 1fr; 
    }
    .global-logos {
      position: static;
      justify-content: center;
      padding-top: 24px;
      margin-bottom: -30px;
    }
  }

  .btn-main {
    padding: 16px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    color: var(--text-muted);
  }

  .btn-main.active {
    color: #fff;
    border-color: var(--accent-blue);
    background: rgba(49, 130, 206, 0.2);
    box-shadow: 0 0 20px rgba(49, 130, 206, 0.4);
    transform: translateY(-2px);
  }

  .btn-main:hover:not(.active) { 
    background: rgba(255, 255, 255, 0.1); 
    color: #fff;
  }

  .sub-menu {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    justify-content: center;
    flex-wrap: wrap; 
  }

  .btn-sub {
    padding: 8px 20px;
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    background: rgba(0,0,0,0.3);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.3s ease;
  }

  .btn-sub.active {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(56, 161, 105, 0.4);
  }

  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    align-items: center;
    padding: 16px 20px;
    flex-wrap: wrap;
  }

  .filter-bar select, .filter-bar input {
    padding: 10px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    transition: all 0.2s;
  }

  .filter-bar select option { 
    background: #1a202c; 
    color: #fff; 
  }

  .filter-bar select:focus, .filter-bar input:focus {
    outline: none;
    border-color: var(--accent-orange);
    box-shadow: 0 0 10px rgba(221, 107, 32, 0.4);
  }

  .filter-bar button {
    padding: 10px 16px;
    background: var(--accent-orange);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .filter-bar button:hover { 
    background: #c05621;
    box-shadow: 0 0 15px rgba(221, 107, 32, 0.6);
  }

  .panel {
    padding: 30px;
    min-height: 200px;
  }

  .panel h2 { 
    margin: 0 0 6px; 
    font-size: 22px; 
    text-transform: capitalize; 
    font-weight: 600; 
  }

  .panel .count { 
    font-size: 13px; 
    color: var(--text-muted); 
    margin-bottom: 24px; 
  }
  
  ul.data-list {
    list-style: none; 
    margin: 0; 
    padding: 0; 
    display: grid; 
    gap: 12px;
  }

  ul.data-list li {
    display: flex; 
    align-items: center; 
    gap: 16px;
    padding: 16px; 
    border: 1px solid var(--glass-border);
    border-radius: 12px; 
    background: rgba(0, 0, 0, 0.2);
    font-size: 14px; 
    cursor: pointer; 
    transition: all 0.2s ease;
  }

  ul.data-list li:hover {
    transform: translateX(6px);
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--accent-blue);
    box-shadow: 0 4px 15px rgba(49, 130, 206, 0.2);
  }

  ul.data-list li .num {
    width: 32px; 
    height: 32px; 
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-orange), #c05621);
    color: #fff; 
    font-size: 13px; 
    font-weight: 600;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  
  .list-text { flex-grow: 1; }
  
  /* Desain Badge Identitas untuk Master WO */
  .id-badges { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; border: 1px solid transparent; }
  
  .badge.cat-mechanical { background: rgba(221, 107, 32, 0.2); border-color: var(--accent-orange); color: #fbd38d; }
  .badge.cat-electrical { background: rgba(49, 130, 206, 0.2); border-color: var(--accent-blue); color: #90cdf4; }
  .badge.cat-modification { background: rgba(128, 90, 213, 0.2); border-color: #805ad5; color: #d6bcfa; }
  
  .badge.stat-approved { background: rgba(56, 161, 105, 0.2); border-color: var(--accent-green); color: #9ae6b4; }
  .badge.stat-pending_finished { background: rgba(214, 158, 46, 0.2); border-color: #d69e2e; color: #fefcbf; }
  .badge.stat-finished { background: rgba(49, 151, 149, 0.2); border-color: #319795; color: #81e6d9; }

  .placeholder, .state { 
    color: var(--text-muted); 
    font-size: 14px; 
    padding: 20px 0; 
    text-align: center; 
  }

  .state.error { 
    color: #fc8181; 
  }

  /* Modal Detail */
  .modal-overlay {
    display: none;
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    z-index: 1000;
    align-items: center; 
    justify-content: center;
    padding: 20px;
  }

  .modal-content {
    width: 100%; 
    max-width: 600px;
    max-height: 85vh;
    display: flex; 
    flex-direction: column;
    position: relative;
  }

  .modal-header {
    padding: 24px; 
    border-bottom: 1px solid var(--glass-border);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 16px 16px 0 0;
  }

  .modal-header h3 { 
    margin: 0; 
    font-size: 18px; 
    font-weight: 600; 
  }

  .close-btn {
    background: none; 
    border: none; 
    font-size: 28px; 
    cursor: pointer; 
    color: var(--text-muted);
    transition: color 0.2s;
  }

  .close-btn:hover { 
    color: #fff; 
  }

  .modal-body {
    padding: 24px; 
    overflow-y: auto;
    border-radius: 0 0 16px 16px;
  }
  
  .role-badge {
    display: inline-block;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  
  .action-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-action {
    flex: 1;
    min-width: 140px;
    padding: 12px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    transition: opacity 0.2s;
  }

  .btn-action:hover { 
    opacity: 0.8; 
  }

  .btn-approve { background: var(--accent-green); }
  .btn-reject { background: var(--rejected); }
  .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

  .detail-row {
    display: flex; 
    flex-direction: column; 
    gap: 6px;
    margin-bottom: 16px; 
    padding-bottom: 16px; 
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .detail-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .detail-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .detail-value { font-size: 15px; color: #fff; white-space: pre-wrap; font-weight: 300; }

  /* Form Aksi: Biaya bertahap & Upload Foto */
  .form-section-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px;
  }

  .biaya-row {
    display: grid;
    grid-template-columns: 1fr 140px 36px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .biaya-row input {
    padding: 10px 12px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    background: rgba(0,0,0,0.35);
    color: #fff;
  }

  .biaya-row input:focus { outline: none; border-color: var(--accent-blue); }

  .btn-remove-row {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--rejected);
    background: rgba(229, 62, 62, 0.15);
    color: #fc8181;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    line-height: 1;
  }
  .btn-remove-row:hover { background: rgba(229, 62, 62, 0.35); }

  .btn-add-row {
    margin-top: 4px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px dashed var(--glass-border);
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    width: 100%;
  }
  .btn-add-row:hover { color: #fff; border-color: var(--accent-blue); background: rgba(49,130,206,0.1); }

  .biaya-total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    font-size: 14px; font-weight: 600;
  }
  .biaya-total-row span.amount { color: var(--accent-green); font-size: 17px; }

  .form-divider { margin: 24px 0; border-top: 1px dashed rgba(255,255,255,0.15); }

  .photo-input-wrap input[type="file"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px dashed var(--glass-border);
    border-radius: 8px;
    background: rgba(0,0,0,0.25);
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
  }

  .photo-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .photo-thumb {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
    aspect-ratio: 1 / 1;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .btn-remove-photo {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #fff; border: none;
    cursor: pointer; font-size: 13px; line-height: 1;
  }

  textarea.form-textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 80px;
  }
  textarea.form-textarea:focus { outline: none; border-color: var(--accent-blue); }

  .form-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    display: flex;
    gap: 12px;
  }

  .upload-progress {
    font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center;
  }

  /* Layar Login */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    text-align: center;
  }

  .login-box h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }

  #login-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    margin-top: 28px;
  }

  #login-form label { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
  #login-form input {
    padding: 12px 16px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: rgba(0,0,0,0.3);
    color: #fff;
  }
  #login-form input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(49, 130, 206, 0.4); }

  #login-submit {
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-blue), #2b6cb0);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }
  #login-submit:hover { box-shadow: 0 0 15px rgba(49, 130, 206, 0.6); transform: translateY(-1px); }

  .logout-btn {
    margin-top: 20px;
    padding: 10px 24px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    transition: all 0.2s;
  }
  .logout-btn:hover { background: rgba(229, 62, 62, 0.8); border-color: transparent; }
  .login-msg { color: #fc8181; font-size: 13px; margin-top: 12px; text-align: center; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
</style>
</head>
<body>

<!-- Logo Global -->
<div class="global-logos">
  <img src="logo inl (3).png" alt="Logo INL">
</div>

<!-- Layar Login -->
<div id="login-screen">
  <div class="login-box glass-panel">
    <h1>SIMANTAP</h1>
    <p style="color:var(--text-muted); font-size:14px; margin:0;">Silakan masuk untuk melanjutkan</p>
    <form id="login-form">
      <label>ID</label>
      <input type="text" id="login-username" required>
      <label>Password</label>
      <input type="password" id="login-password" required>
      <button type="submit" id="login-submit">Masuk</button>
      <div class="login-msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- Konten Utama Dashboard -->
<div id="app-content" style="display:none;">
  <header>
    <h1>SIMANTAP</h1>
    <p>Pantau keseluruhan tiket Work Order secara realtime.</p>
    
    <div id="user-role-badge" class="role-badge"></div><br>
    
    <button id="logout-btn" class="logout-btn">Keluar Dashboard</button>
  </header>

  <main>
    <!-- Menu Utama -->
    <div class="main-menu">
      <button class="btn-main glass-panel active" data-category="master">Master WO</button>
      <button class="btn-main glass-panel" data-category="mechanical">Mechanical</button>
      <button class="btn-main glass-panel" data-category="electrical">Electrical</button>
      <button class="btn-main glass-panel" data-category="modification">Modification</button>
    </div>

    <!-- Sub Menu -->
    <div class="sub-menu" id="sub-menu-container" style="display:none;">
      <button class="btn-sub active" data-status="pending">Pending Approval</button>
      <button class="btn-sub" data-status="approved">On Progress</button>
      <button class="btn-sub" data-status="pending_finished">Pending Finished</button>
      <button class="btn-sub" data-status="finished">Finished</button>
      <button class="btn-sub" data-status="rejected">Rejected</button>
    </div>

    <!-- Filter Waktu -->
    <div class="filter-bar glass-panel">
      <select id="filter-type">
        <option value="all">Semua Waktu</option>
        <option value="single">Tanggal Tertentu</option>
        <option value="range">Rentang Tanggal</option>
      </select>
      
      <div id="filter-date-1-container" style="display:none; align-items:center; gap:8px;">
        <span style="font-size:13px; color:var(--text-muted);">Tgl:</span>
        <input type="date" id="filter-date-1">
      </div>
      
      <div id="filter-date-2-container" style="display:none; align-items:center; gap:8px;">
        <span style="font-size:13px; color:var(--text-muted);">s/d</span>
        <input type="date" id="filter-date-2">
      </div>
      
      <button id="btn-apply-filter">Terapkan Filter</button>
      <button id="btn-export-pdf" type="button" style="background:var(--accent-blue);">Export PDF</button>
    </div>

    <div class="panel glass-panel" id="panel">
      <div class="placeholder">Memuat data...</div>
    </div>
  </main>
</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content glass-panel">
    <div class="modal-header">
      <h3 id="modal-title">Detail Work Order</h3>
      <button class="close-btn" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Di-render via JS -->
    </div>
  </div>
</div>

<!-- Modal Form Aksi (Input Biaya bertahap + Upload Foto) -->
<div class="modal-overlay" id="form-modal-overlay">
  <div class="modal-content glass-panel">
    <div class="modal-header">
      <h3 id="form-modal-title">Form Aksi</h3>
      <button class="close-btn" id="form-modal-close">&times;</button>
    </div>
    <div class="modal-body" id="form-modal-body">
      <!-- Di-render via JS -->
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ============================================================================
// KONFIGURASI URL
// ============================================================================
// PERHATIAN: Masukkan link hasil DEPLOY APPS SCRIPT (Web App) ke sini.
// URL ini sekarang dipakai untuk 3 hal: login, action (approve/reject/dst),
// dan pengambilan data (doGet) -- data diambil LANGSUNG dari Spreadsheet,
// bukan lagi lewat link "Publish to web" CSV yang punya jeda cache dari Google.
const LOGIN_API_URL = "https://script.google.com/macros/s/AKfycbyLSH0_M2CcJ2hTw-LmxN8yQuPxv6CSzXCU52St25o9ETYgWuEiLz6_7TOwMG5UgBHE/exec";

// ============================================================================
// STATE APLIKASI
// ============================================================================
let activeCategory = "master"; 
let activeStatus = "pending"; 

// Data untuk dirender: Array berisi objek { rowData: [], category: "", status: "", labelStatus: "" }
let currentDataObjects = [];
let globalHeaders = [];

// Variabel untuk interaksi modal
let targetRequestId = ""; 
let targetItemCategory = ""; 
let targetItemStatus = "";
let targetCurrentBiaya = ""; // Menyimpan teks biaya tiket yang sedang dibuka, dipakai untuk fitur edit bebas biaya (Finished)

// Menyimpan hasil filter yang sedang tampil, dipakai untuk Export PDF
let lastExportRows = [];
let lastExportTitle = "";

const mainBtns = document.querySelectorAll(".btn-main");
const subBtns = document.querySelectorAll(".btn-sub");
const subMenuContainer = document.getElementById("sub-menu-container");
const panel = document.getElementById("panel");

mainBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeCategory = btn.getAttribute("data-category");
    mainBtns.forEach(b => b.classList.remove("active"));

      subMenuContainer.style.display = "none";

    }
    fetchData();

});

subBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeStatus = btn.getAttribute("data-status");
    subBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    fetchData();
  });
});

const filterType = document.getElementById("filter-type");
const date1Cont = document.getElementById("filter-date-1-container");
const date2Cont = document.getElementById("filter-date-2-container");
const date1Input = document.getElementById("filter-date-1");
const date2Input = document.getElementById("filter-date-2");
const btnApplyFilter = document.getElementById("btn-apply-filter");

filterType.addEventListener("change", () => {
  const val = filterType.value;
  if (val === "all") {
    date1Cont.style.display = "none";
    date2Cont.style.display = "none";
  } else if (val === "single") {
    date1Cont.style.display = "flex";
    date2Cont.style.display = "none";
  } else if (val === "range") {
    date1Cont.style.display = "flex";
    date2Cont.style.display = "flex";
  }
});

btnApplyFilter.addEventListener("click", () => { renderData(); });

function getFilterPeriodLabel() {
  const val = filterType.value;
  const fmt = (iso) => {
    if (!iso) return "";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
  };
  if (val === "single" && date1Input.value) {
    return `Tanggal ${fmt(date1Input.value)}`;
  } else if (val === "range" && date1Input.value && date2Input.value) {
    return `Rentang ${fmt(date1Input.value)} s/d ${fmt(date2Input.value)}`;
  }
  return "Semua Waktu";
}

async function exportToPDF() {
  if (!window.jspdf) {
    alert("Modul PDF belum siap dimuat, coba lagi sesaat lagi.");
    return;
  }
  if (!lastExportRows || lastExportRows.length === 0) {
    alert("Tidak ada data pada filter saat ini untuk diekspor.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });

  const periodLabel = getFilterPeriodLabel();

  doc.setFontSize(15);
  doc.text("SIMANTAP - " + lastExportTitle, 40, 40);
  doc.setFontSize(10);
  doc.setTextColor(90);
  doc.text(`Periode data: ${periodLabel}`, 40, 58);
  doc.text(`Diekspor pada: ${new Date().toLocaleString('id-ID')}`, 40, 72);
  doc.setTextColor(0);

  doc.autoTable({
    startY: 88,
    head: [["No", "Nomor WO / Request ID", "Nama Pemohon", "Kategori", "Status", "Tanggal"]],
    body: lastExportRows,
    styles: { fontSize: 9, cellPadding: 5 },
    headStyles: { fillColor: [49, 130, 206], textColor: 255 },
    alternateRowStyles: { fillColor: [245, 247, 250] }
  });

  const safeCategory = activeCategory === "master" ? "master" : activeCategory;
  const safeStatus = activeCategory === "master" ? "semua-status" : activeStatus;
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  doc.save(`SIMANTAP_${safeCategory}_${safeStatus}_${stamp}.pdf`);
}

document.getElementById("btn-export-pdf").addEventListener("click", exportToPDF);

function parseCSVDateToISO(dateStr) {
  if (!dateStr) return "";
  let cleanStr = dateStr.split(" ")[0]; 
  if (cleanStr.includes("/")) {
    let parts = cleanStr.split("/");
    if (parts.length === 3 && parts[2].length === 4) {
      return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
    }
  }
  let d = new Date(dateStr);
  if (!isNaN(d.getTime())) return d.toISOString().split("T")[0];
  return cleanStr; 
}

function findColumnsIndex(header) {
  const woIdx = header.findIndex(h => h.toLowerCase().trim().includes("nomor wo"));
  const reqIdx = header.findIndex(h => h.toLowerCase().trim().includes("request id"));
  const nameIdx = header.findIndex(h => h.toLowerCase().trim() === "nama" || h.toLowerCase().trim().includes("nama pemohon"));
  const dateIdx = header.findIndex(h => h.toLowerCase().trim().includes("timestamp") || h.toLowerCase().trim().includes("tanggal"));
  return {
    idIdx: woIdx !== -1 ? woIdx : (reqIdx !== -1 ? reqIdx : 0),
    nameIdx: nameIdx !== -1 ? nameIdx : 1,
    dateIdx: dateIdx !== -1 ? dateIdx : -1
  };
}

async function fetchData() {
  panel.innerHTML = `<div class="state">Memuat data...</div>`;
  currentDataObjects = [];
  globalHeaders = [];

  try {
    if (activeCategory === "master") {
      const res = await fetch(`${LOGIN_API_URL}?mode=master&_=${Date.now()}`);
      if (!res.ok) throw new Error("Gagal mengambil data master (status " + res.status + ")");
      const result = await res.json();
      if (!result.success) throw new Error(result.message || "Gagal memuat data master");

      globalHeaders = result.headers || [];
      currentDataObjects = (result.items || []).map(it => ({
        rowData: it.rowData,
        category: it.category,
        status: it.status,
        labelStat: it.labelStat
      }));

    } else {
      const params = new URLSearchParams({
        mode: "single",
        category: activeCategory,
        status: activeStatus,
        _: Date.now()
      });
      const res = await fetch(`${LOGIN_API_URL}?${params.toString()}`);
      if (!res.ok) throw new Error("Gagal mengambil data (status " + res.status + ")");
      const result = await res.json();
      if (!result.success) throw new Error(result.message || "Gagal memuat data");

      globalHeaders = result.headers || [];
      currentDataObjects = (result.rows || []).map(r => ({
        rowData: r,
        category: activeCategory,
        status: activeStatus,
        labelStat: ""
      }));
    }

    if (currentDataObjects.length === 0) {
      let t = activeCategory === "master" ? "Data Master WO" : `Data ${activeCategory}`;
      panel.innerHTML = `<h2>${t}</h2><div class="state error">Data kosong atau tidak ditemukan.</div>`;
      return;
    }
    
    renderData();

  } catch (err) {
    panel.innerHTML = `<h2>Data Error</h2><div class="state error">Gagal memuat: ${escapeHtml(err.message)}</div>`;
  }
}

function renderData() {
  let title = activeCategory === "master" ? "Seluruh Data Master WO" : `Data ${activeCategory} - ${activeStatus}`;
  const cols = findColumnsIndex(globalHeaders);
  
  const filterVal = filterType.value;
  const d1 = date1Input.value;
  const d2 = date2Input.value;
  
  let filteredItems = [];
  let exportRows = [];

  // Label status yang lagi aktif (dipakai kalau bukan Master WO)
  const activeStatusLabelMap = {
    pending: "PENDING APPROVAL",
    approved: "ON PROGRESS",
    pending_finished: "PENDING FINISHED",
    finished: "FINISHED",
    rejected: "REJECTED"
  };

  for (let i = 0; i < currentDataObjects.length; i++) {
    const itemObj = currentDataObjects[i];
    const r = itemObj.rowData;
    let include = true;

    // Filter Waktu
    if (cols.dateIdx !== -1 && filterVal !== "all") {
      const rowDateIso = parseCSVDateToISO(r[cols.dateIdx]);
      if (filterVal === "single" && d1) {
        if (rowDateIso !== d1) include = false;
      } else if (filterVal === "range" && d1 && d2) {
        if (rowDateIso < d1 || rowDateIso > d2) include = false;
      }
    }

    if (include) {
      const req = (r[cols.idIdx] || "").trim();
      const name = (r[cols.nameIdx] || "").trim();
      const tanggal = cols.dateIdx !== -1 ? (r[cols.dateIdx] || "-").trim() : "-";
      const catLabel = activeCategory === "master" ? itemObj.category : activeCategory;
      const statLabel = activeCategory === "master" ? itemObj.labelStat : (activeStatusLabelMap[itemObj.status] || itemObj.status);
      
      let topStr = req && name ? `<strong>${escapeHtml(req)}</strong> &mdash; ${escapeHtml(name)}` : escapeHtml(req || name);
      
      // Jika di Master WO, tambahkan Badge Identitas
      let badgeHtml = "";
      if (activeCategory === "master") {
        badgeHtml = `
          <div class="id-badges">
            <span class="badge cat-${itemObj.category}">${itemObj.category}</span>
            <span class="badge stat-${itemObj.status}">${itemObj.labelStat}</span>
          </div>
        `;
      }
      
      let htmlStr = `
        <div class="list-text">
          <div>${topStr}</div>
          ${badgeHtml}
        </div>
      `;
      
      filteredItems.push({ 
        originalIndex: i, 
        html: htmlStr, 
        reqId: req,
        itemCat: itemObj.category,
        itemStat: itemObj.status
      });

      exportRows.push([ filteredItems.length, req || "-", name || "-", catLabel, statLabel, tanggal ]);
    }
  }

  lastExportRows = exportRows;
  lastExportTitle = title;

  if (filteredItems.length === 0) {
    panel.innerHTML = `<h2>${title}</h2><div class="state">Tidak ada tiket yang sesuai dengan filter.</div>`;
    return;
  }

  panel.innerHTML = `
    <h2>${title}</h2>
    <div class="count">${filteredItems.length} tiket ditemukan</div>
    <ul class="data-list">
      ${filteredItems.map((item, idx) => `
        <li onclick="showModal(${item.originalIndex}, '${item.reqId}', '${item.itemCat}', '${item.itemStat}')">
          <span class="num">${idx+1}</span>
          ${item.html}
        </li>`).join("")}
    </ul>
  `;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function showModal(originalIndex, reqId, itemCat, itemStat) {
  const itemObj = currentDataObjects[originalIndex];
  const rowData = itemObj.rowData;
  
  // Set variabel global untuk digunakan oleh eksekutor action
  targetRequestId = reqId; 
  targetItemCategory = itemCat;
  targetItemStatus = itemStat;

  // Cari kolom biaya pada data tiket ini, dipakai untuk fitur edit bebas
  // biaya khusus tiket Finished (role Engineering).
  const biayaColIdx = globalHeaders.findIndex(h => h && h.toLowerCase().includes("biaya"));
  targetCurrentBiaya = biayaColIdx !== -1 ? (rowData[biayaColIdx] || "") : "";

  let html = "";
  
  for (let i = 0; i < globalHeaders.length; i++) {
    const headerName = globalHeaders[i] ? globalHeaders[i].trim() : `Kolom ${i+1}`;
    const value = rowData[i] ? rowData[i].trim() : "-";
    if (headerName !== "") {
      html += `<div class="detail-row"><div class="detail-label">${escapeHtml(headerName)}</div><div class="detail-value">${escapeHtml(value)}</div></div>`;
    }
  }

  const userRole = sessionStorage.getItem("userRole");
  
  // LOGIKA TOMBOL AKSI BERDASARKAN STATUS TIKET AKTUAL DAN ROLE USER
  // (Berlaku sama baik dilihat dari tab Master WO maupun dari tab departemen
  // Mechanical/Electrical/Modification, karena itemCat & itemStat selalu
  // mengikuti data tiket itu sendiri, bukan tab yang sedang aktif.)
  if (userRole === "engineering" && targetItemStatus === "pending") {
    html += `
      <div class="action-footer" id="action-footer">
        <button class="btn-action btn-approve" onclick="executeAction('approved')">Terima (Approve)</button>
        <button class="btn-action btn-reject" onclick="executeAction('rejected')">Tolak (Reject)</button>
      </div>
      <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
    `;
  } 
  else if (userRole === "engineering" && targetItemStatus === "approved") {
    html += `
      <div class="action-footer" id="action-footer">
        <button class="btn-action btn-approve" style="background:var(--accent-blue);" onclick="openPendingFinishedForm()">Selesaikan WO (Kirim ke Pending Finished)</button>
      </div>
      <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
    `;
  }
  else if (userRole === "user" && targetItemStatus === "pending_finished") {
    html += `
      <div class="action-footer" id="action-footer">
        <button class="btn-action btn-approve" style="background:var(--accent-green);" onclick="executeAction('finished')">Konfirmasi WO Selesai</button>
        <button class="btn-action btn-reject" onclick="openReopenForm()">Belum Sesuai (Kembalikan)</button>
      </div>
      <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
    `;
  }
  else if (userRole === "engineering" && targetItemStatus === "finished") {
    // Fitur pembukuan: Engineering bisa memodifikasi rincian biaya tiket yang
    // sudah Finished secara bebas (edit/tambah/hapus baris lama), tanpa
    // sistem menghitung ulang total secara otomatis.
    html += `
      <div class="action-footer" id="action-footer">
        <button class="btn-action btn-approve" style="background:var(--accent-blue);" onclick="openEditBiayaForm()">Edit Rincian Biaya</button>
      </div>
      <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
    `;
  }
  
  modalBody.innerHTML = html;
  modalOverlay.style.display = "flex";
}

async function executeAction(actionType, extra) {
  extra = extra || {};
  let rejectReason = "";
  let biayaWo = "";
  let photos = extra.photos || [];
  
  if (actionType === "rejected") {
    rejectReason = prompt("Mohon masukkan alasan menolak (Reject) tiket ini:");
    if (rejectReason === null || rejectReason.trim() === "") {
      alert("Aksi dibatalkan: Alasan penolakan wajib diisi!");
      return;
    }
  } else if (actionType === "pending_finished") {
    // Dirakit oleh openPendingFinishedForm() -> submitPendingFinishedForm().
    // Rincian biaya BERSIFAT OPSIONAL di tahap ini -- operator/engineering di
    // lapangan mungkin belum tahu detail harga barang saat WO baru selesai
    // dikerjakan. Biaya bisa dilengkapi/diperbaiki nanti setelah tiket
    // berstatus Finished lewat fitur "Edit Rincian Biaya".
    biayaWo = extra.biayaWo || "";
  } else if (actionType === "finished") {
    if (!confirm(`Anda yakin mengkonfirmasi bahwa tiket ini benar-benar selesai?`)) return;
  } else if (actionType === "approved") {
    if (!confirm(`Anda yakin ingin menerima (Approve) tiket ini?`)) return;
  } else if (actionType === "reopen") {
    // Sudah dirakit oleh openReopenForm() -> submitReopenForm()
    rejectReason = extra.rejectReason || "";
  } else if (actionType === "update_biaya_finished") {
    // Sudah dikonfirmasi & dirakit oleh openEditBiayaForm() -> submitEditBiayaForm()
    biayaWo = extra.biayaWo || "";
  }

  // Tentukan konteks tombol/pesan: form aksi (biaya/reopen/edit biaya) pakai
  // elemen sendiri, aksi lain (approve/reject/finish) pakai footer di modal
  // detail seperti biasa.
  const usingFormModal = (actionType === "pending_finished" || actionType === "reopen" || actionType === "update_biaya_finished");
  const btnFooter = document.getElementById(usingFormModal ? "form-action-footer" : "action-footer");
  const msgBox = document.getElementById(usingFormModal ? "form-action-msg" : "action-msg");
  const buttons = btnFooter ? btnFooter.querySelectorAll("button") : [];
  buttons.forEach(b => b.disabled = true);
  
  if (msgBox) {
    msgBox.innerHTML = photos.length > 0
      ? `Mengunggah ${photos.length} foto & memproses data ke server, mohon tunggu...`
      : "Memproses data ke server, mohon tunggu...";
    msgBox.style.color = "var(--text-muted)";
  }

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ 
        type: "action", 
        action: actionType, 
        category: targetItemCategory, // Menggunakan kategori milik tiket tersebut
        requestId: targetRequestId,
        rejectReason: rejectReason, 
        biayaWo: biayaWo,
        photos: photos, // [{ data, mimeType, name }]
        role: sessionStorage.getItem("userRole") || "" // dipakai backend untuk verifikasi aksi khusus role tertentu
      })
    });
    
    const result = await res.json();

    if (result.success) {
      if (msgBox) {
        msgBox.innerHTML = "Berhasil! Data telah diperbarui.";
        msgBox.style.color = "var(--accent-green)";
      }
      setTimeout(() => {
        modalOverlay.style.display = "none";
        formModalOverlay.style.display = "none";
        fetchData(); 
      }, 1500);
    } else {
      if (msgBox) {
        msgBox.innerHTML = "Gagal: " + result.message;
        msgBox.style.color = "var(--rejected)";
      }
      buttons.forEach(b => b.disabled = false); 
    }
  } catch (err) {
    if (msgBox) {
      msgBox.innerHTML = "Gagal menghubungi server.";
      msgBox.style.color = "var(--rejected)";
    }
    buttons.forEach(b => b.disabled = false);
  }
}

function formatRupiah(num) {
  const n = Number(num) || 0;
  return "Rp " + n.toLocaleString('id-ID');
}

// Kompres & ubah foto jadi base64 supaya tidak terlalu berat saat diupload
function resizeImageToBase64(file, maxWidth = 1280, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("Bukan file gambar")); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({
          data: dataUrl.split(",")[1],
          mimeType: "image/jpeg",
          name: (file.name || "foto").replace(/\.[^.]+$/, "") + ".jpg",
          previewUrl: dataUrl
        });
      };
      img.onerror = () => reject(new Error("Gagal membaca gambar"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.readAsDataURL(file);
  });
}

async function handlePhotoInputChange(fileInputEl, previewContainerId) {
  const files = Array.from(fileInputEl.files || []);
  for (const file of files) {
    if (file.size > 8 * 1024 * 1024) {
      alert(`File "${file.name}" terlalu besar (maks 8MB), dilewati.`);
      continue;
    }
    try {
      const photo = await resizeImageToBase64(file);
      selectedPhotos.push(photo);
    } catch (err) {
      alert(`Gagal memproses foto "${file.name}": ${err.message}`);
    }
  }
  fileInputEl.value = ""; // reset supaya bisa pilih file yang sama lagi kalau perlu
  renderPhotoPreviews(previewContainerId);
}

function renderPhotoPreviews(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = selectedPhotos.map((p, idx) => `
    <div class="photo-thumb">
      <img src="${p.previewUrl}" alt="preview">
      <button type="button" class="btn-remove-photo" onclick="removeSelectedPhoto(${idx}, '${containerId}')">&times;</button>
    </div>
  `).join("");
}

function removeSelectedPhoto(idx, containerId) {
  selectedPhotos.splice(idx, 1);
  renderPhotoPreviews(containerId);
}

function renderBiayaRows() {
  const container = document.getElementById("biaya-rows-container");
  container.innerHTML = biayaRows.map((row, idx) => `
    <div class="biaya-row">
      <input type="text" placeholder="Deskripsi pengeluaran (mis. Ganti bearing)" value="${escapeHtml(row.desc)}" data-idx="${idx}" data-field="desc">
      <input type="number" min="0" placeholder="Harga (Rp)" value="${row.harga}" data-idx="${idx}" data-field="harga">
      <button type="button" class="btn-remove-row" ${biayaRows.length <= 1 ? "disabled" : ""} data-idx="${idx}">&times;</button>
    </div>
  `).join("");

  container.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const idx = Number(e.target.getAttribute("data-idx"));
      const field = e.target.getAttribute("data-field");
      biayaRows[idx][field] = e.target.value;
      const total = biayaRows.reduce((sum, r) => sum + (Number(r.harga) || 0), 0);
      const totalEl = document.getElementById("biaya-total-display");
      if (totalEl) totalEl.textContent = formatRupiah(total);
    });
  });

  container.querySelectorAll(".btn-remove-row").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const idx = Number(e.target.getAttribute("data-idx"));
      biayaRows.splice(idx, 1);
      renderBiayaRows();
      const total = biayaRows.reduce((sum, r) => sum + (Number(r.harga) || 0), 0);
      document.getElementById("biaya-total-display").textContent = formatRupiah(total);
    });
  });
}

function submitPendingFinishedForm() {
  // Rincian biaya bersifat OPSIONAL: operator boleh mengirim WO ke Pending
  // Finished walau belum tahu detail harga barang. Biaya bisa dilengkapi
  // belakangan oleh Engineering setelah tiket berstatus Finished.
  const validRows = biayaRows.filter(r => r.desc.trim() !== "" && Number(r.harga) > 0);

  let biayaText = "";
  let confirmMsg = "Kirim WO ini ke Pending Finished tanpa rincian biaya (biaya bisa dilengkapi nanti)?";

  if (validRows.length > 0) {
    const total = validRows.reduce((sum, r) => sum + Number(r.harga), 0);
    const lines = validRows.map(r => `- ${r.desc.trim()}: ${formatRupiah(r.harga)}`);
    lines.push(`TOTAL: ${formatRupiah(total)}`);
    biayaText = lines.join("\n");
    confirmMsg = `Kirim WO ini ke Pending Finished dengan total biaya ${formatRupiah(total)}?`;
  }

  if (!confirm(confirmMsg)) return;

  executeAction("pending_finished", { biayaWo: biayaText, photos: selectedPhotos });
}

  formModalTitle.textContent = "Kembalikan ke On Progress — Catatan & Bukti Foto";
  renderReopenForm();
  formModalOverlay.style.display = "flex";
}

function renderReopenForm() {
  formModalBody.innerHTML = `

    <textarea class="form-textarea" id="reopen-note" placeholder="Contoh: Kebocoran masih ada di sambungan pipa, mohon diperiksa ulang..."></textarea>

function submitReopenForm() {
  const note = document.getElementById("reopen-note").value.trim();
  if (!note) {
    alert("Mohon isi catatan kenapa hasil perbaikan belum sesuai.");
    return;
  }
  if (!confirm("WO ini akan dikembalikan ke status ON PROGRESS dengan nomor WO yang SAMA (tidak dibuat WO baru). Lanjutkan?")) return;

  executeAction("reopen", { rejectReason: note, photos: selectedPhotos });
}

btnCloseModal.addEventListener("click", () => { modalOverlay.style.display = "none"; });

// ============================================================================
// LOGIKA LOGIN & AUTHENTIKASI
// ============================================================================
const loginScreen = document.getElementById("login-screen");
const appContent = document.getElementById("app-content");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginSubmit = document.getElementById("login-submit");
const roleBadge = document.getElementById("user-role-badge");

if (sessionStorage.getItem("loggedIn") === "true") {
  loginScreen.style.display = "none";
  appContent.style.display = "block";
  roleBadge.textContent = "Akses: " + (sessionStorage.getItem("userRole") || "USER").toUpperCase();
  fetchData(); 
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();

  loginMsg.textContent = "";
  loginSubmit.disabled = true;
  loginSubmit.textContent = "Memeriksa...";

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ type: "login", username, password })
    });
    const result = await res.json();

    if (result.success) {
      sessionStorage.setItem("loggedIn", "true");
      sessionStorage.setItem("userRole", result.role || "user");
      loginScreen.style.display = "none";
      appContent.style.display = "block";
      roleBadge.textContent = "Akses: " + (result.role || "user").toUpperCase();
      fetchData(); 
    } else {
      loginMsg.textContent = result.message || "ID atau password salah.";
    }
  } catch (err) {
    loginMsg.textContent = "Gagal menghubungi server login.";
  } finally {
    loginSubmit.disabled = false;
    loginSubmit.textContent = "Masuk";
  }
});

document.getElementById("logout-btn").addEventListener("click", () => {
  sessionStorage.removeItem("loggedIn");
  sessionStorage.removeItem("userRole");
  loginForm.reset();
  appContent.style.display = "none";
  loginScreen.style.display = "flex";
});
</script>
